name: Terraform Deploy

on:
  workflow_dispatch:

    inputs:

      project_name:
        description: "Project Name"
        required: true
        default: "infra"

      aws_region:
        description: "AWS Region"
        required: true
        default: "us-east-1"

      vpc_cidr:
        description: "VPC CIDR"
        required: true
        default: "10.0.0.0/24"

      public_subnet_cidr:
        description: "Public Subnet CIDR"
        required: true
        default: "10.0.0.0/28"

      private_subnet_cidr:
        description: "Private Subnet CIDR"
        required: true
        default: "10.0.0.16/28"

      instance_type:
        description: "EC2 Instance Type"
        required: true
        default: "t3.micro"

      action:
        description: "Terraform Action"
        required: true
        default: "apply"

permissions:
  id-token: write
  contents: read

jobs:

  validate-inputs:

    runs-on: ubuntu-latest

    steps:

      - name: Validate Region
        run: |
          case "${{ github.event.inputs.aws_region }}" in
            us-east-1|us-east-2|us-west-1|us-west-2)
              echo "Region Valid"
              ;;
            *)
              echo "Invalid Region"
              exit 1
              ;;
          esac

      - name: Validate Instance Type
        run: |
          case "${{ github.event.inputs.instance_type }}" in
            t2.micro|t3.micro)
              echo "Instance Type Valid"
              ;;
            *)
              echo "Only Free Tier Instance Types Allowed"
              exit 1
              ;;
          esac

      - name: Validate CIDR Format
        run: |
          CIDR="${{ github.event.inputs.vpc_cidr }}"

          if [[ ! $CIDR =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$ ]]; then
            echo "Invalid CIDR"
            exit 1
          fi

          echo "CIDR Valid"

  terraform-deploy:

    needs: validate-inputs

    runs-on: ubuntu-latest

    environment: production

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::947782089242:role/GitHub_Role
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: environments/dev
        run: terraform init

      - name: Terraform Plan
        working-directory: environments/dev
        run: |
          terraform plan \
          -var="project_name=${{ github.event.inputs.project_name }}" \
          -var="aws_region=${{ github.event.inputs.aws_region }}" \
          -var="vpc_cidr=${{ github.event.inputs.vpc_cidr }}" \
          -var="public_subnet_cidr=${{ github.event.inputs.public_subnet_cidr }}" \
          -var="private_subnet_cidr=${{ github.event.inputs.private_subnet_cidr }}" \
          -var="instance_type=${{ github.event.inputs.instance_type }}"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: environments/dev
        run: |
          terraform apply -auto-approve \
          -var="project_name=${{ github.event.inputs.project_name }}" \
          -var="aws_region=${{ github.event.inputs.aws_region }}" \
          -var="vpc_cidr=${{ github.event.inputs.vpc_cidr }}" \
          -var="public_subnet_cidr=${{ github.event.inputs.public_subnet_cidr }}" \
          -var="private_subnet_cidr=${{ github.event.inputs.private_subnet_cidr }}" \
          -var="instance_type=${{ github.event.inputs.instance_type }}"

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: environments/dev
        run: |
          terraform destroy -auto-approve \
          -var="project_name=${{ github.event.inputs.project_name }}" \
          -var="aws_region=${{ github.event.inputs.aws_region }}" \
          -var="vpc_cidr=${{ github.event.inputs.vpc_cidr }}" \
          -var="public_subnet_cidr=${{ github.event.inputs.public_subnet_cidr }}" \
          -var="private_subnet_cidr=${{ github.event.inputs.private_subnet_cidr }}" \
          -var="instance_type=${{ github.event.inputs.instance_type }}"