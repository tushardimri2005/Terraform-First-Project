name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:

      aws_region:
        description: "AWS Region"
        required: true

      instance_type:
        description: "EC2 Instance Type"
        required: true

      vpc_cidr:
        description: "VPC CIDR"
        required: true

      public_subnet_cidr:
        description: "Public Subnet CIDR"
        required: true

      private_subnet_cidr:
        description: "Private Subnet CIDR"
        required: true

      action:
        description: "Terraform Action"
        required: true
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:

  validate-inputs:

    runs-on: ubuntu-latest

    steps:

      - name: Validate AWS Region
        run: |
          REGION="${{ github.event.inputs.aws_region }}"

          case "$REGION" in
            us-east-1|us-east-2|us-west-1|us-west-2)
              echo "Valid AWS Region"
              ;;
            *)
              echo "Invalid AWS Region"
              exit 1
              ;;
          esac

      - name: Validate Instance Type
        run: |
          INSTANCE="${{ github.event.inputs.instance_type }}"

          case "$INSTANCE" in
            t2.micro|t3.micro)
              echo "Valid Instance Type"
              ;;
            *)
              echo "Only approved free-tier instance types are allowed"
              exit 1
              ;;
          esac

      - name: Validate CIDR Format
        run: |
          for CIDR in \
          "${{ github.event.inputs.vpc_cidr }}" \
          "${{ github.event.inputs.public_subnet_cidr }}" \
          "${{ github.event.inputs.private_subnet_cidr }}"
          do

            if [[ ! $CIDR =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$ ]]; then
              echo "Invalid CIDR Block: $CIDR"
              exit 1
            fi

          done

          echo "CIDR Validation Passed"

  terraform-deploy:

    needs: validate-inputs

    runs-on: ubuntu-latest

    environment: production

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::947782089242:role/GitHub_Role
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: environments/dev
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: environments/dev
        run: terraform validate -no-color

      - name: Terraform Plan
        working-directory: environments/dev
        run: |
          terraform plan \
          -input=false \
          -var-file="terraform.tfvars" \
          -var="aws_region=${{ github.event.inputs.aws_region }}" \
          -var="instance_type=${{ github.event.inputs.instance_type }}" \
          -var="vpc_cidr=${{ github.event.inputs.vpc_cidr }}" \
          -var="public_subnet_cidr=${{ github.event.inputs.public_subnet_cidr }}" \
          -var="private_subnet_cidr=${{ github.event.inputs.private_subnet_cidr }}"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: environments/dev
        run: |
          terraform apply \
          -auto-approve \
          -input=false \
          -var-file="terraform.tfvars" \
          -var="aws_region=${{ github.event.inputs.aws_region }}" \
          -var="instance_type=${{ github.event.inputs.instance_type }}" \
          -var="vpc_cidr=${{ github.event.inputs.vpc_cidr }}" \
          -var="public_subnet_cidr=${{ github.event.inputs.public_subnet_cidr }}" \
          -var="private_subnet_cidr=${{ github.event.inputs.private_subnet_cidr }}"

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: environments/dev
        run: |
          terraform destroy \
          -auto-approve \
          -input=false \
          -var-file="terraform.tfvars" \
          -var="aws_region=${{ github.event.inputs.aws_region }}" \
          -var="instance_type=${{ github.event.inputs.instance_type }}" \
          -var="vpc_cidr=${{ github.event.inputs.vpc_cidr }}" \
          -var="public_subnet_cidr=${{ github.event.inputs.public_subnet_cidr }}" \
          -var="private_subnet_cidr=${{ github.event.inputs.private_subnet_cidr }}"